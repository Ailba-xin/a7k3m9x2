name: 刷新手机版数据

on:
  schedule:
    - cron: '*/5 * * * *'      # 每 5 分钟跑一次
  workflow_dispatch: {}          # 也可以手动点 Run workflow

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取仓库
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 抓取交易数据
        env:
          QBCKS: ${{ secrets.QBCKS }}
          QBKEY: ${{ secrets.QBKEY }}
        run: node scripts/fetch-trades.mjs

      - name: 提交到 data 分支（不触发 Pages 构建）
        run: |
          set -e
          git config user.name "qb-bot"
          git config user.email "qb-bot@users.noreply.github.com"
          mkdir -p /tmp/qbout
          cp data.json status.json /tmp/qbout/
          git checkout --orphan data-new 2>/dev/null || true
          git rm -rf . >/dev/null 2>&1 || true
          cp /tmp/qbout/data.json data.json
          cp /tmp/qbout/status.json status.json
          git add -f data.json status.json
          git commit -m "数据 $(date '+%Y-%m-%d %H:%M')" || echo "no change"
          git push -f origin HEAD:data