<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Q币余额表 · 独立版</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1c589e">
<style>
:root{--blue:#1c589e;--green:#16873f;--red:#c0392b;--amber:#b8860b;--gray:#6b7686;--bg:#eef2f8;--card:#fff;--line:#dfe4ec}
*{box-sizing:border-box}
html{width:100%;max-width:100%;overflow-x:hidden}
body{margin:0;background:var(--bg);color:#1d2733;font:16px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;padding-bottom:28px;width:100%;max-width:100vw;overflow-x:hidden;overflow-wrap:anywhere;word-break:break-word}
header,section,ul,footer,.sum,.row,.who,.amt,.empty,.sheet,.det{min-width:0;max-width:100%}
.sum>div{min-width:0}
header{background:var(--blue);color:#fff;padding:12px 14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
header h1{margin:0;font-size:18px;font-weight:700}
header h1 .sub{font-size:12px;font-weight:400;opacity:.85;margin-left:4px}
header #ts{font-size:12px;opacity:.9;margin-right:auto}
.hdbtn{font-size:12px;padding:4px 9px;border-radius:8px;border:1px solid rgba(255,255,255,.55);background:transparent;color:#fff;cursor:pointer;-webkit-appearance:none}
.sum{display:flex;gap:10px;padding:12px 14px 4px}
.sum>div{flex:1;background:var(--card);border-radius:12px;padding:12px 14px;box-shadow:0 2px 8px rgba(22,32,43,.06)}
.sum .k{display:block;font-size:13px;color:var(--gray)}
.sum b{display:block;font-size:26px;font-weight:800;color:#0f7a37;letter-spacing:.3px}
.empty{margin:28px 14px;padding:26px;background:var(--card);border-radius:14px;text-align:center;color:var(--gray)}
.empty button{margin-top:14px;font-size:16px;padding:10px 20px;border:0;border-radius:10px;background:var(--blue);color:#fff}
ul#list{list-style:none;margin:8px 0 0;padding:0 10px}
ul#list li{background:var(--card);border-radius:12px;margin-bottom:8px;box-shadow:0 2px 8px rgba(22,32,43,.05);overflow:hidden}
.row{display:flex;align-items:center;gap:10px;padding:12px 14px}
.who{flex:1 1 auto;min-width:0}
.name{font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.uin{font-size:12.5px;color:var(--gray);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.amt{text-align:right;flex:0 0 auto}
.qb{font-size:22px;font-weight:800;color:#0f7a37;font-variant-numeric:tabular-nums}
.qd{font-size:12px;color:var(--gray)}
.badge{font-size:12px;padding:3px 7px;border-radius:7px;white-space:nowrap;font-weight:600}
.b-delta-down{background:#fdecea;color:var(--red)}
.b-delta-up{background:#e8f6ec;color:var(--green)}
.b-err{background:#fdecea;color:var(--red)}
.risk{background:#ffecec;color:var(--red);border:1px solid #f6c9c9;font-weight:700}
.det{padding:0 14px 12px;font-size:12.5px;color:var(--gray);display:flex;gap:14px;flex-wrap:wrap}
.det .v{color:#1d2733;font-weight:600}
footer{text-align:center;color:var(--gray);font-size:12px;padding:14px}
.modal{position:fixed;inset:0;background:rgba(16,24,34,.45);display:flex;align-items:flex-end;z-index:99}
.modal[hidden]{display:none}
.sheet{background:#fff;width:100%;border-radius:16px 16px 0 0;padding:16px;max-height:88vh;overflow:auto}
.sheet h2{margin:0 0 6px;font-size:17px}
.sheet p{margin:4px 0 10px;font-size:13px;color:var(--gray)}
.sheet textarea{width:100%;height:190px;border:1px solid var(--line);border-radius:10px;padding:10px;font:13px/1.5 ui-monospace,Consolas,monospace;resize:vertical}
.sheet .btns{display:flex;gap:10px;margin-top:12px}
.sheet .btns button{flex:1;padding:12px;border-radius:10px;border:0;font-size:16px}
.sheet .btns .ok{background:var(--blue);color:#fff}
.sheet .btns .no{background:#eef1f6;color:#33404f}
#ptbar{position:fixed;left:0;right:0;top:0;z-index:120;padding:9px;text-align:center;font-size:14px;color:#fff;background:var(--blue);transform:translateY(-100%);transition:transform .15s}
</style>
</head>
<body>
<header>
  <h1>Q币余额表<span class="sub">独立版</span></h1>
  <span id="ts">正在读取…</span>
  <button class="hdbtn" id="uinbtn" onclick="toggleUin()">隐藏QQ号</button>
  <button class="hdbtn" onclick="openImport()">导入CK</button>
  <button class="hdbtn" onclick="openSettings()">设置</button>
</header>

<div class="sum">
  <div><span class="k">Q币合计</span><b id="sqb">—</b></div>
  <div><span class="k">Q点合计</span><b id="sqd">—</b></div>
</div>

<div class="empty" id="empty" hidden>
  还没有账号<br>
  <span style="font-size:13px">先在电脑上用「右键 → 复制全部 CK」，把内容粘到这里</span><br>
  <button onclick="openImport()">粘贴 CK 导入</button>
</div>

<ul id="list"></ul>
<footer id="foot">数据存在本机，直连腾讯查询；电脑关机也能用</footer>
<div id="ptbar"></div>

<div class="modal" id="setBox" hidden>
  <div class="sheet">
    <h2>设置</h2>
    <p>自动刷新间隔</p>
    <select id="ivSel" style="width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;font-size:16px">
      <option value="1">1 分钟</option>
      <option value="3">3 分钟</option>
      <option value="5">5 分钟</option>
      <option value="10">10 分钟</option>
      <option value="30">30 分钟</option>
    </select>
    <p style="margin-top:14px">显示设置</p>
    <label style="display:flex;align-items:center;gap:8px;font-size:15px">
      <input type="checkbox" id="hideChk" onchange="setHide(this.checked)" style="width:18px;height:18px"> 隐藏 QQ 号
    </label>
    <p style="margin-top:14px">账号：<b id="setCnt">0</b> 个　最后一次刷新：<b id="setLast">—</b></p>
    <p style="margin-top:4px;font-size:12px">数据只存在这台手机里；电脑关机也能用。</p>
    <div class="btns">
      <button class="no" onclick="clearAllChanges()">清除变化记录</button>
      <button class="ok" onclick="closeSettings()">完成</button>
    </div>
  </div>
</div>

<div class="modal" id="importBox" hidden>
  <div class="sheet">
    <h2>导入账号</h2>
    <p>格式每行一个：<code>昵称|QQ号|openid|openkey</code><br>
       也可以直接粘 <code>openid=...&amp;openkey=...</code> 这种参数串。<br>
       内容只存在这台手机里，不会上传任何服务器。</p>
    <textarea id="importText" placeholder="示例昵称|123456789|XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX|YYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYY"></textarea>
    <div class="btns">
      <button class="no" onclick="closeImport()">取消</button>
      <button class="ok" onclick="doImport()">导入</button>
    </div>
  </div>
</div>

<script>
var KEY_ACC='qbstd_acc_v1', KEY_HIDE='qbstd_hide_v1';
var ACC=[], HIDE=false, BUSY=false, FIRST=true;

function ls(k,d){ try{ var v=localStorage.getItem(k); return v==null?d:JSON.parse(v); }catch(e){ return d; } }
function lss(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }

function loadAll(){
  ACC = ls(KEY_ACC, []) || [];
  HIDE = ls(KEY_HIDE, false) === true;
  document.getElementById('uinbtn').textContent = HIDE ? '显示QQ号' : '隐藏QQ号';
}
function saveAll(){ lss(KEY_ACC, ACC); }

function maskUin(u){
  if(!u) return '';
  if(!HIDE) return u;
  return u.length<=6 ? u.substring(0,1)+'***' : u.substring(0,4)+'****'+u.substring(u.length-2);
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return c==='&'?'&amp;':(c==='<'?'&lt;':(c==='>'?'&gt;':'&quot;'));}); }
function f2(v){ return (v===null||v===undefined||v==='')?'—':Number(v).toFixed(2); }

/* ---------- JSONP 查询：一次一个（接口回调名固定 _getQBBalance） ---------- */
var _cb=null, _seq=0;
function _getQBBalance(data){
  if(typeof _cb==='function'){ var f=_cb; _cb=null; f(data); }
}
function queryOne(a, done){
  var base='https://api.unipay.qq.com/v1/r/1450000186/wechat_query?cmd=4&pf=vip_m-pay_html5-html5&pfkey=pfkey&from_h5=1&from_https=1&format=jsonp__getQBBalance';
  var url=base
    +'&openid='+encodeURIComponent(a.openid||'')
    +'&openkey='+encodeURIComponent(a.openkey||'')
    +'&session_id='+encodeURIComponent(a.sessionId||'openid')
    +'&session_type='+encodeURIComponent(a.sessionType||'kp_accesstoken')
    +'&qq_appid='+encodeURIComponent(a.appid||'101502376')
    +'&_t='+(Date.now())+'_'+(++_seq);
  var finished=false;
  function fin(d){ if(finished) return; finished=true; if(_cb===fin2) _cb=null; done(d); }
  var fin2=fin;
  _cb=fin;
  var s=document.createElement('script');
  s.src=url;
  s.onerror=function(){ fin(null); };
  document.body.appendChild(s);
  setTimeout(function(){ fin(null); }, 12000);
}

function refreshAll(){
  if(BUSY) return;
  if(!ACC.length){ paint(); return; }
  BUSY=true;
  document.getElementById('ts').textContent='查询中…';
  var i=0, okc=0;
  function next(){
    if(i>=ACC.length){
      BUSY=false;
      document.getElementById('ts').textContent='更新于 '+hms();
      saveAll(); paint();
      return;
    }
    var a=ACC[i];
    queryOne(a, function(d){
      a.tryAt=hms();
      if(d && d.ret===0){
        var qb=(Number(d.qb_balance||0))/100, qd=(Number(d.qd_balance||0))/100;
        if(a.qb!==undefined && a.qb!==null && Math.abs(a.qb-qb)>0.004){
          a.delta=Math.round((qb-a.qb)*100)/100;
          a.deltaAt=mdhm();
        }
        a.qb=qb; a.qd=qd; a.err=''; okc++;
      } else {
        a.err = (d && d.msg) ? d.msg : '查询失败';
      }
      i++; next();
    });
  }
  next();
}

function hms(){ var d=new Date(); function p(n){return (n<10?'0':'')+n;} return p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds()); }
function mdhm(){ var d=new Date(); function p(n){return (n<10?'0':'')+n;} return p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes()); }

/* ---------- 渲染 ---------- */
function paint(){
  var ul=document.getElementById('list');
  var empty=document.getElementById('empty');
  empty.hidden = ACC.length>0;
  var h='', sqb=0, sqd=0;
  for(var i=0;i<ACC.length;i++){
    var a=ACC[i];
    if(a.qb!==undefined && a.qb!==null) sqb+=Number(a.qb);
    if(a.qd!==undefined && a.qd!==null) sqd+=Number(a.qd);
    h+='<li><div class="row">';
    h+='<div class="who"><div class="name">'+esc(a.nick||('账号'+(i+1)))+'</div>';
    h+='<div class="uin">'+esc(maskUin(a.uin||''))+(a.delta?' · <b style="color:'+(a.delta>0?'#16873f':'#c0392b')+'">'+(a.delta>0?'▲ +':'▼ ')+a.delta.toFixed(2)+' '+esc(a.deltaAt||'')+'</b>':'')+'</div></div>';
    h+='<div class="amt"><div class="qb">'+(a.err?'—':f2(a.qb))+'</div><div class="qd">'+(a.err?'查询失败':(f2(a.qd)+' Q点'))+'</div></div>';
    if(a.err) h+='<span class="badge b-err">⚠ 查询失败</span>';
    h+='</div>';
    h+='<div class="det">';
    h+='<span>Q币 <span class="v">'+f2(a.qb)+'</span></span>';
    h+='<span>Q点 <span class="v">'+f2(a.qd)+'</span></span>';
    h+='<span>最近查询 <span class="v">'+esc(a.tryAt||'—')+'</span></span>';
    if(a.delta) h+='<span style="cursor:pointer" onclick="clearDelta('+i+')">清除变化</span>';
    h+='</div></li>';
  }
  ul.innerHTML=h;
  document.getElementById('sqb').textContent=f2(Math.round(sqb*100)/100);
  document.getElementById('sqd').textContent=f2(Math.round(sqd*100)/100);
}
function clearDelta(i){ if(ACC[i]){ delete ACC[i].delta; delete ACC[i].deltaAt; saveAll(); paint(); } }

function toggleUin(){
  HIDE=!HIDE; lss(KEY_HIDE,HIDE);
  document.getElementById('uinbtn').textContent=HIDE?'显示QQ号':'隐藏QQ号';
  paint();
}

/* ---------- 导入 ---------- */
function openImport(){
  document.getElementById('importText').value='';
  document.getElementById('importBox').hidden=false;
}
function closeImport(){ document.getElementById('importBox').hidden=true; }
function doImport(){
  var raw=document.getElementById('importText').value||'';
  var lines=raw.split(/\r?\n/);
  var added=0, updated=0;
  for(var i=0;i<lines.length;i++){
    var ln=lines[i].trim();
    if(!ln) continue;
    var p=ln.split('|');
    var nick='', uin='', oid='', okey='';
    if(p.length>=4){ nick=p[0].trim(); uin=p[1].trim(); oid=p[2].trim(); okey=p[3].trim(); }
    else {
      var m1=/openid=([0-9A-Za-z]+)/.exec(ln), m2=/openkey=([0-9A-Za-z]+)/.exec(ln);
      if(!m1||!m2) continue;
      oid=m1[1]; okey=m2[1];
      var mu=/[?&]uin=([0-9]+)/.exec(ln); if(mu) uin=mu[1];
    }
    if(!oid||!okey) continue;
    var found=null;
    for(var j=0;j<ACC.length;j++) if(ACC[j].openid===oid) { found=ACC[j]; break; }
    if(found){ found.nick=nick||found.nick; found.uin=uin||found.uin; found.openkey=okey; updated++; }
    else { ACC.push({nick:nick,uin:uin,openid:oid,openkey:okey}); added++; }
  }
  saveAll();
  closeImport();
  paint();
  if(added+updated>0){ refreshAll(); }
  else { alert('没有识别到有效内容。\n请用电脑版「右键 → 复制全部 CK」复制后再粘贴。'); }
}

/* ---------- 下拉刷新 ---------- */
var ptStart=0, ptPull=0, ptOn=false, ptBarEl=null;
function ptBar(show,text,color){
  if(!ptBarEl) ptBarEl=document.getElementById('ptbar');
  if(text) ptBarEl.textContent=text;
  ptBarEl.style.background=color||'#1c589e';
  ptBarEl.style.transform=show?'translateY(0)':'translateY(-100%)';
}
function atTop(){ return (window.pageYOffset||document.documentElement.scrollTop||0)<=0; }
document.addEventListener('touchstart',function(e){ if(e.touches.length!==1)return; ptStart=e.touches[0].clientY; ptPull=0; ptOn=atTop(); },{passive:true});
document.addEventListener('touchmove',function(e){
  if(!ptOn||e.touches.length!==1)return;
  var dy=e.touches[0].clientY-ptStart;
  if(dy<=0){ if(ptPull>0){ptPull=0;ptBar(false);} return; }
  if(!atTop()){ ptOn=false; ptBar(false); return; }
  ptPull=dy;
  ptBar(true, dy>70?'松开手就刷新':'下拉可以刷新', dy>70?'#16873f':'#1c589e');
  if(e.cancelable) e.preventDefault();
},{passive:false});
document.addEventListener('touchend',function(){ if(!ptOn)return; var dy=ptPull; ptOn=false; ptPull=0; if(dy>70){ ptBar(true,'正在刷新…'); refreshAll(); setTimeout(function(){ptBar(false);},1200); } else ptBar(false); },{passive:true});

/* ---------- 一键导入链接（#d=<base64>）：手机点开链接自动导入 CK ---------- */
function importFromHash(){
  try{
    if(!location.hash || location.hash.indexOf('#d=')!==0) return false;
    var rawHash = location.hash.substring(1);   // d=...&k=...
    var parts = rawHash.split('&');
    var dVal = '', kVal = '';
    for (var hi = 0; hi < parts.length; hi++) {
      var kv = parts[hi].split('=');
      if (kv[0] === 'd') dVal = kv.slice(1).join('=');
      if (kv[0] === 'k') kVal = kv.slice(1).join('=');
    }
    if (kVal) { lss('qbstd_key_v1', kVal); }
    var b64=decodeURIComponent(dVal);
    var txt=decodeURIComponent(escape(atob(b64)));
    document.getElementById('importText').value=txt;
    doImport();
    try{ history.replaceState(null,'',location.pathname); }catch(e){}
    return true;
  }catch(e){ return false; }
}

/* ---------- 启动 ---------- */
loadAll();
paint();
importFromHash();
refreshAll();
IV = getIV(); startTimer();
document.addEventListener('visibilitychange',function(){ if(!document.hidden){ var t=document.getElementById('ts').textContent; if(t.indexOf('更新于')<0) refreshAll(); } });

/* ---------- 设置面板（2026-10-17 按用户要求把电脑版手机端的设置搬过来） ---------- */
var KEY_IV='qbstd_iv_v1', IV=5, _timer=null;
function getIV(){ var v=Number(ls(KEY_IV,5)); return (v>=1&&v<=60)?v:5; }
function startTimer(){ if(_timer) clearInterval(_timer); _timer=setInterval(function(){ if(!document.hidden) refreshAll(); }, IV*60*1000); }
function openSettings(){
  document.getElementById('ivSel').value=String(IV);
  document.getElementById('hideChk').checked=HIDE;
  document.getElementById('setCnt').textContent=ACC.length;
  var last='—'; for(var i=0;i<ACC.length;i++){ if(ACC[i].tryAt){ last=ACC[i].tryAt; break; } }
  document.getElementById('setLast').textContent=last;
  document.getElementById('setBox').hidden=false;
}
function closeSettings(){
  var v=Number(document.getElementById('ivSel').value)||5;
  IV=v; lss(KEY_IV,v); startTimer();
  document.getElementById('setBox').hidden=true;
  document.getElementById('ts').textContent='刷新间隔已设为 '+IV+' 分钟';
  setTimeout(function(){ if(!BUSY){ var d=new Date(); function p(n){return (n<10?'0':'')+n;} document.getElementById('ts').textContent='更新于 '+p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds()); } }, 1500);
}
function setHide(v){ HIDE=!!v; lss(KEY_HIDE,HIDE); document.getElementById('uinbtn').textContent=HIDE?'显示QQ号':'隐藏QQ号'; paint(); }
function clearAllChanges(){
  for(var i=0;i<ACC.length;i++){ delete ACC[i].delta; delete ACC[i].deltaAt; }
  saveAll(); paint(); closeSettings();
}

if('serviceWorker' in navigator){
  window.addEventListener('load',function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
}
</script>
<style>
.wxs{font-size:12px;color:#6b7686;margin-top:3px;white-space:nowrap}
.wxs b{color:#1d2733}
.wxs.warn{color:#b8860b}
.tag{font-size:11.5px;padding:2px 6px;border-radius:6px;margin-left:6px;vertical-align:middle;white-space:nowrap}
.tag-risk{background:#ffecec;color:#c0392b;border:1px solid #f6c9c9;font-weight:700}
.tag-ok{background:#e8f6ec;color:#16873f}
.det-list{margin-top:6px;border-top:1px dashed #e3e8ef;padding-top:6px}
.det-row{display:flex;justify-content:space-between;font-size:12px;padding:2px 0;color:#3a4655}
.det-row .t{color:#6b7686;margin-right:8px}
.det-row.wx{color:#0f7a37;font-weight:600}
.det-risk{background:#ffecec;border:1px solid #f6c9c9;color:#c0392b;border-radius:8px;padding:6px 8px;font-size:12px;margin-top:6px;line-height:1.5}
</style>
<script>
/* ---------- 交易数据（来自 GitHub Actions 定时抓取的 data.json，同源无跨域） ---------- */
var SITE = {};
function b64ToBytes(s){
  var bin = atob(s), out = new Uint8Array(bin.length);
  for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}
function hexToBytes(h){
  var out = new Uint8Array(h.length / 2);
  for (var i = 0; i < out.length; i++) out[i] = parseInt(h.substr(i * 2, 2), 16);
  return out;
}
async function decryptPayload(j){
  var keyHex = ls('qbstd_key_v1', '');
  if (!keyHex || String(keyHex).length !== 64) return null;
  if (!(window.crypto && crypto.subtle)) return null;
  try {
    var key = await crypto.subtle.importKey('raw', hexToBytes(String(keyHex)), { name: 'AES-GCM' }, false, ['decrypt']);
    var pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64ToBytes(j.iv), tagLength: 128 }, key, b64ToBytes(j.ct));
    return JSON.parse(new TextDecoder().decode(pt));
  } catch (e) { return null; }
}
function loadSite(){
  return fetch('data.json?t=' + Date.now(), { cache: 'no-store' })
    .then(function(r){ return r.ok ? r.json() : null; })
    .then(function(j){
      if (!j) return;
      if (j.v === 1 && j.ct) {
        return decryptPayload(j).then(function(plain){
          if (plain && plain.accounts) { SITE = plain.accounts; patchRows(); }
          else { SITE = {}; patchRows(); }
        });
      }
      if (j.accounts) { SITE = j.accounts; patchRows(); }
    })
    .catch(function(){});
}
function uinOf(li){
  var el = li.querySelector('.uin');
  return el ? (el.getAttribute('data-uin') || '') : '';
}
function patchRows(){
  var lis = document.querySelectorAll('#list li');
  for(var i=0;i<lis.length;i++){
    var li = lis[i];
    var nameEl = li.querySelector('.name');
    var amtEl = li.querySelector('.amt');
    if(!nameEl || !amtEl) continue;
    // 从账号数据里找 uid：页面渲染时把 uin 放在 .uin 的 textContent 里（已可能被隐藏），
    // 所以我们用 ACC 数组的下标来定位（顺序一致）
    var a = ACC[i];
    if(!a) continue;
    var s = SITE[a.uin] || {};
    // 1) 微信支付格
    var wxs = amtEl.querySelector('.wxs');
    if(!wxs){ wxs = document.createElement('div'); wxs.className='wxs'; amtEl.appendChild(wxs); }
    if(s.err){ wxs.textContent = '查询失败'; wxs.className='wxs warn'; }
    else if(typeof s.wx7 === 'number'){ wxs.innerHTML = '微信 <b>'+s.wx7+'</b> 次 · '+Number(s.wx7sum||0).toFixed(2)+' 元'; wxs.className = (s.wx7<4?'wxs warn':'wxs'); }
    else { wxs.textContent=''; }
    // 2) 风险标签
    var tag = nameEl.querySelector('.tag-risk');
    if(s.risk===1){
      if(!tag){ tag=document.createElement('span'); tag.className='tag tag-risk'; tag.textContent='⚠ 账号风险'; nameEl.appendChild(tag); }
      tag.title = (s.why||'') + (s.retry? '｜建议 '+s.retry+' 再试':'');
    } else if(tag){ tag.remove(); }
    // 3) 明细：微信支付记录 + 交易记录
    var det = li.querySelector('.det');
    if(det){
      var key = 'det_built_' + a.uin + '_' + (s.wx7===undefined?'x':s.wx7) + '_' + (s.trades?s.trades.length:0);
      if(det.getAttribute('data-k') !== key){
        det.setAttribute('data-k', key);
        var h = '';
        if(s.risk===1) h += '<div class="det-risk">⚠ '+ (s.why||'这个号已经充不进微信支付了') + (s.retry? '<br>建议 '+s.retry+' 再试一笔':'') +'</div>';
        var wx = s.wx || [];
        if(wx.length){
          h += '<div class="det-list">';
          for(var k=0;k<Math.min(wx.length,6);k++){
            var r2=wx[k], d2=new Date(r2.t*1000), p2=function(n){return (n<10?'0':'')+n;};
            h += '<div class="det-row wx"><span class="t">'+p2(d2.getMonth()+1)+'-'+p2(d2.getDate())+' '+p2(d2.getHours())+':'+p2(d2.getMinutes())+'</span><span>微信 +'+Number(r2.amt).toFixed(2)+'</span></div>';
          }
          h += '</div>';
        }
        var tr = s.trades || [];
        if(tr.length){
          h += '<div class="det-list">';
          for(var m=0;m<Math.min(tr.length,10);m++){
            var r3=tr[m], d3=new Date(r3.t*1000), p3=function(n){return (n<10?'0':'')+n;};
            h += '<div class="det-row"><span class="t">'+p3(d3.getMonth()+1)+'-'+p3(d3.getDate())+' '+p3(d3.getHours())+':'+p3(d3.getMinutes())+'</span><span>'+(r3.show||'')+' '+(r3.ch||'')+' +'+Number(r3.amt).toFixed(2)+'</span></div>';
          }
          h += '</div>';
        }
        det.innerHTML = h || det.innerHTML;
      }
    }
  }
}
loadSite();
setInterval(function(){ loadSite(); }, 10*60*1000);
setInterval(patchRows, 1500);
document.addEventListener('visibilitychange', function(){ if(!document.hidden) loadSite(); });
</script><style>
/* A版同款：明细默认折叠，点一下展开；异常提示条；回顶部 */
#alertbar{display:none;margin:10px 14px 0;padding:10px 12px;border-radius:10px;font-size:13.5px;line-height:1.55}
#alertbar.show{display:block}
#alertbar.warn{background:#fff7e6;border:1px solid #f3d9a4;color:#8a5a00}
#alertbar.danger{background:#fdecea;border:1px solid #f6c9c9;color:#b03024}
ul#list li .det{display:none}
ul#list li.open .det{display:flex;flex-direction:column}
ul#list li.open .row .arrow{transform:rotate(90deg)}
.arrow{display:inline-block;transition:transform .18s;color:#9aa6b6;font-size:12px;margin-left:2px}
#topBtn{position:fixed;right:16px;bottom:22px;width:46px;height:46px;border-radius:50%;border:0;background:rgba(28,88,158,.92);color:#fff;font-size:20px;display:none;z-index:60;box-shadow:0 4px 14px rgba(16,28,44,.28)}
#topBtn.show{display:block}
.li-tap{cursor:pointer}
</style>
<script>
/* ---------- A版同款：折叠展开 / 已读 / 异常提示 / 回顶部 / 断网缓存 ---------- */
var KEY_SITE_CACHE = 'qbstd_site_cache_v1';
var BIG = 100;                 // 大额变动阈值（和电脑版默认一致）
var SITE_TS = 0;

function applySiteCache(){
  try { var c = ls(KEY_SITE_CACHE, null); if (c && c.accounts) { SITE = c.accounts; SITE_TS = c.ts || 0; } } catch(e){}
}
function saveSiteCache(){
  try { lss(KEY_SITE_CACHE, { ts: Date.now(), accounts: SITE }); } catch(e){}
}
applySiteCache();

function bigOf(a){
  if (!a) return false;
  var d = Number(a.delta || 0);
  return Math.abs(d) >= BIG;
}
function readKey(i){ return 'qbstd_read_' + (ACC[i] && (ACC[i].openid || i)); }
function isRead(i){ return ls(readKey(i), false) === true; }
function markRead(i){ lss(readKey(i), true); }

function paintAlert(){
  var bar = document.getElementById('alertbar');
  if (!bar) return;
  var risks = [], bigs = [];
  for (var i = 0; i < ACC.length; i++) {
    var a = ACC[i];
    var s = SITE[a.uin] || {};
    if (s.risk === 1) risks.push(a.nick || a.uin);
    if (bigOf(a) && !isRead(i)) bigs.push(a.nick || a.uin);
  }
  if (!risks.length && !bigs.length) { bar.className = ''; bar.textContent = ''; return; }
  var txt = [];
  if (risks.length) txt.push('⚠ ' + risks.length + ' 个账号风险：' + risks.slice(0, 4).join('、') + (risks.length > 4 ? ' 等' : ''));
  if (bigs.length) txt.push('△ ' + bigs.length + ' 个号有大额变动（≥' + BIG + '）：' + bigs.slice(0, 4).join('、') + (bigs.length > 4 ? ' 等' : ''));
  bar.textContent = txt.join('\n');
  bar.className = 'show ' + (risks.length ? 'danger' : 'warn');
}

function patchRows2(){
  paintAlert();
  var lis = document.querySelectorAll('#list li');
  for (var i = 0; i < lis.length; i++) {
    var li = lis[i], a = ACC[i];
    if (!a) continue;
    // 1) 箭号 + 可点击
    var row = li.querySelector('.row');
    if (row && !row.querySelector('.arrow')) {
      var ar = document.createElement('span'); ar.className = 'arrow'; ar.textContent = '›';
      row.appendChild(ar);
      row.classList.add('li-tap');
    }
    // 2) 已读：大额变动标记过就自动收起来
    if (bigOf(a) && isRead(i) && !li.classList.contains('open')) li.classList.add('read');
    // 3) 折叠状态下不加载明细内容（省事：保持原样，CSS 控制显示）
  }
  // 回顶部按钮
  var tb = document.getElementById('topBtn');
  if (tb) { if ((window.pageYOffset || 0) > 320) tb.classList.add('show'); else tb.classList.remove('show'); }
}

/* 点击整行 → 展开/收起明细；第一次展开算"已读"（大额变动提示消失） */
document.addEventListener('click', function (ev) {
  var li = ev.target && ev.target.closest ? ev.target.closest('#list li') : null;
  if (!li) return;
  if (ev.target.closest('a,button')) return;
  var lis = document.querySelectorAll('#list li'), idx = -1;
  for (var i = 0; i < lis.length; i++) if (lis[i] === li) { idx = i; break; }
  if (idx < 0) return;
  var wasOpen = li.classList.contains('open');
  if (wasOpen) { li.classList.remove('open'); return; }
  li.classList.add('open');
  markRead(idx);
  var a = ACC[idx];
  if (a && a.delta) { delete a.delta; delete a.deltaAt; saveAll(); }
  patchRows2();
}, false);

/* 双击行 → 收起（A版行为） */
var lastTapT = 0, lastTapI = -1;
document.addEventListener('click', function (ev) {
  var li = ev.target && ev.target.closest ? ev.target.closest('#list li') : null;
  if (!li) return;
  var now = Date.now();
  var lis = document.querySelectorAll('#list li'), idx = -1;
  for (var i = 0; i < lis.length; i++) if (lis[i] === li) { idx = i; break; }
  if (now - lastTapT < 340 && idx === lastTapI) { li.classList.remove('open'); lastTapT = 0; return; }
  lastTapT = now; lastTapI = idx;
}, false);

/* 回顶部按钮 */
(function(){
  var b = document.createElement('button');
  b.id = 'topBtn'; b.textContent = '↑'; b.title = '回到顶部';
  b.onclick = function(){ window.scrollTo({ top: 0, behavior: 'smooth' }); };
  document.body.appendChild(b);
})();
window.addEventListener('scroll', function(){ patchRows2(); }, { passive: true });

/* 异常提示条位置：插在合计卡片后面 */
(function(){
  var bar = document.createElement('div');
  bar.id = 'alertbar';
  var sum = document.querySelector('.sum');
  if (sum && sum.parentNode) sum.parentNode.insertBefore(bar, sum.nextSibling);
})();

/* 定时合并进主渲染（原来的 patchRows 也在跑） */
setInterval(function(){ patchRows2(); }, 1300);
window.addEventListener('load', function(){ setTimeout(patchRows2, 800); });
</script></body>
</html>
